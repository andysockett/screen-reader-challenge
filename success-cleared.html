<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Cleared!</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 30px; text-align: center; }
        
        /* The Success Banner */
        .success-banner {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }
        
        /* Semantic Heading for the banner */
        .success-banner h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .next-step {
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="success-banner" role="status">
        <h1>Submission Successful. Challenge Cleared!</h1>
    </div>

    <div class="next-step">
        <p>You have successfully reached the end of the path. Unfortunately Hippo 3000 stock is no longer available.</p>
        
        <p>
            <a href="login-challenge.html">Try again?</a>
        </p>
    </div>

</body>
</html>
