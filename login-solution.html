<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Login Solution (Blind Test)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #333; }
        h1 { font-size: 2.5em; font-weight: bold; margin-bottom: 20px; } 
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .text-input { width: 100%; padding: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .text-input:focus { outline: 3px solid #008cba; outline-offset: 2px; }

        /* Safe CSS class-based opacity toggle */
        .challenge-container { opacity: 0; }
        .challenge-container.revealed { opacity: 1; }

        #loginError {
            color: white; background-color: #d9534f; padding: 10px; margin-bottom: 15px; display: none; 
        }
        .submit-control { 
            background-color: #008cba; color: white; padding: 15px 25px; border: none; 
            cursor: pointer; text-transform: uppercase; font-weight: bold; display: inline-block; 
            margin-top: 15px; font-size: 1em;
        }
        .submit-control:focus { outline: 3px solid #222; outline-offset: 2px; }

        /* Bypass button pinned to bottom corner */
        #giveUpBtn {
            position: fixed; bottom: 20px; right: 20px; background-color: #222; color: #fff;
            padding: 12px 20px; border: 2px solid #fff; border-radius: 4px; font-weight: bold;
            cursor: pointer; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #giveUpBtn:hover { background-color: #444; }
    </style>
</head>
<body>

    <div id="challengeContent" class="challenge-container">
        <h1>Hippo 3000 Sign-In</h1>
        <p>We are thrilled to announce the new Hippo 3000! Sign in below to get early access and view your account details.</p>

        <img src="placeholder_hippo.png" alt="Hippo 3000 corporate logo" class="logo-image">

        <p>Key Feature Spotlight:</p>
        <ul>
            <li>50% More Hippo</li>
            <li>New Silent Cooling System</li>
            <li>24-Hour Battery Life</li>
        </ul>

        <p>Please log in to continue your journey.</p>
        
        <div id="loginError" role="alert"></div>

        <form id="loginForm" onsubmit="validateLogin(event);">
            <div class="form-group">
                <label for="usernameInput">Username</label>
                <input id="usernameInput" type="text" class="text-input" required>
            </div>
            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input id="passwordInput" type="password" class="text-input" required>
            </div>
            
            <button type="submit" class="submit-control">Login to Profile Update</button>
        </form>
    </div>

    <button id="giveUpBtn" aria-hidden="true" tabindex="-1" onclick="toggleOpacity();">
        Give up, show page
    </button>

    <script>
        const CORRECT_USERNAME = 'exclusive@hippodigital.co.uk';
        const FALSE_PASSWORD = 'blindtest';
        const CORRECT_PASSWORD = 'hippo3000';

        function validateLogin(event) {
            event.preventDefault(); 
            const email = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (email === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                window.location.href = 'profile-solution.html';
            } else if (email === CORRECT_USERNAME && password === FALSE_PASSWORD) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Login Failed. The password is actually hippo3000.';
            } else {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Login Failed. Please check your username and password.';
            }
        }

        function toggleOpacity() {
            const content = document.getElementById('challengeContent');
            const btn = document.getElementById('giveUpBtn');
            content.classList.toggle('revealed');
            btn.textContent = content.classList.contains('revealed') ? 'Hide page again' : 'Give up, show page';
        }
    </script>
</body>
</html>
